# ============================================================================
# .github/workflows/review.yml
# AI Code Review — automated pull request analysis
# ============================================================================
#
# Two execution modes — controlled by the repository variable REVIEW_MODE:
#
#   REVIEW_MODE=webhook  (default)
#     GitHub Actions → POST signed payload → Express /api/webhook/github
#     → BullMQ → Review Worker → FastAPI → LangGraph + Gemini → GitHub
#
#   REVIEW_MODE=local
#     GitHub Actions → Python ReviewSupervisor → Gemini → GitHub check/comment
#     No external server needed; uses GEMINI_API_KEY secret directly.
#
# Required GitHub Secrets  (Settings → Secrets and variables → Actions):
#   REVIEW_WEBHOOK_URL    - Full URL to Express webhook, e.g. https://api.example.com/api/webhook/github
#   REVIEW_WEBHOOK_SECRET - Same value as GITHUB_WEBHOOK_SECRET on the Express server
#   GEMINI_API_KEY        - Google Gemini API key (local mode only)
#
# Required GitHub Variables (Settings → Secrets and variables → Actions → Variables):
#   REVIEW_MODE           - "webhook" (default) or "local"
#   GEMINI_MODEL          - Optional; e.g. gemini-2.0-flash-exp (local mode only)
#
# ============================================================================

name: AI Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize

# Minimum permissions required for PR commenting and check creation
permissions:
  contents: read
  pull-requests: write
  checks: write    # Required for Check Run creation in local mode

# Cancel in-progress runs for the same PR when a new push arrives.
# Note: in webhook mode the Express BullMQ layer handles its own idempotency
# using the X-GitHub-Delivery header; cancellation here keeps Actions queues clean.
concurrency:
  group: ai-review-${{ github.repository }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      # fetch-depth: 0 gives the full Git history needed for git blame,
      # commit comparison, and changed-file analysis in local mode.
      # Retained even in webhook mode for parity.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ══════════════════════════════════════════════════════════════════════
      # OPTION A — Deployed Express server (REVIEW_MODE=webhook or unset)
      # ══════════════════════════════════════════════════════════════════════

      # ── 2a. Send signed webhook to the deployed Express server ────────────
      #
      # Uses the native GitHub Actions event payload ($GITHUB_EVENT_PATH) so
      # the full PR context is forwarded to the Express webhook without manual
      # reconstruction.
      #
      # The HMAC-SHA256 signature is calculated over the exact bytes that are
      # sent with --data-binary, so Express verifyWebhook middleware accepts it.
      #
      # The BullMQ worker uses diff_url inside pull_request{} to fetch the diff;
      # there is no need to download or attach the diff here.
      - name: Send review webhook (Option A — deployed server)
        if: vars.REVIEW_MODE != 'local'
        env:
          REVIEW_WEBHOOK_URL: ${{ secrets.REVIEW_WEBHOOK_URL }}
          REVIEW_WEBHOOK_SECRET: ${{ secrets.REVIEW_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          # ── Guard: abort gracefully if webhook URL is not configured
          if [ -z "${REVIEW_WEBHOOK_URL:-}" ]; then
            echo "::warning::REVIEW_WEBHOOK_URL secret is not configured. Skipping webhook dispatch."
            echo "Set REVIEW_WEBHOOK_URL to your deployed Express endpoint, or set REVIEW_MODE=local."
            exit 0
          fi

          if [ -z "${REVIEW_WEBHOOK_SECRET:-}" ]; then
            echo "::error::REVIEW_WEBHOOK_SECRET secret is required for webhook signature verification."
            exit 1
          fi

          # ── Read the exact event payload that GitHub handed to this runner
          payload="$(cat "$GITHUB_EVENT_PATH")"

          # ── Generate HMAC-SHA256 signature over the exact payload bytes
          # The sed strips the "SHA256(stdin)= " prefix from openssl output.
          signature=$(printf '%s' "$payload" \
            | openssl dgst -sha256 -hmac "$REVIEW_WEBHOOK_SECRET" \
            | sed 's/^.* //')

          # ── Unique delivery ID using run_id + attempt (matches BullMQ jobId format)
          delivery_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          # ── Dispatch the signed webhook
          # --fail-with-body: exit non-zero and print body on HTTP 4xx/5xx
          # --data-binary:    preserves exact payload bytes (no shell transformation)
          http_response=$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --url "$REVIEW_WEBHOOK_URL" \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: pull_request" \
            --header "X-GitHub-Delivery: ${delivery_id}" \
            --header "X-Hub-Signature-256: sha256=${signature}" \
            --write-out "\n%{http_code}" \
            --data-binary "$payload")

          http_status=$(echo "$http_response" | tail -n1)
          response_body=$(echo "$http_response" | head -n -1)

          echo "Webhook response status: ${http_status}"
          echo "Webhook response body: ${response_body}"

          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "::error::Webhook returned HTTP ${http_status}. Check that REVIEW_WEBHOOK_URL is reachable and REVIEW_WEBHOOK_SECRET matches the server GITHUB_WEBHOOK_SECRET."
            exit 1
          fi

          echo "::notice::Review job queued successfully (delivery: ${delivery_id})"

      # ══════════════════════════════════════════════════════════════════════
      # OPTION B — GitHub Actions-only local reviewer (REVIEW_MODE=local)
      # ══════════════════════════════════════════════════════════════════════
      #
      # Uses the existing Python ReviewSupervisor + Gemini directly in-runner.
      # No Express server, BullMQ, Redis, or MySQL required.
      # GitHub operations use the built-in github.token via GH_TOKEN.

      # ── 2b. Set up Python ─────────────────────────────────────────────────
      - name: Set up Python (Option B — local reviewer)
        if: vars.REVIEW_MODE == 'local'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3b. Install agent-service dependencies ────────────────────────────
      - name: Install Python dependencies (Option B — local reviewer)
        if: vars.REVIEW_MODE == 'local'
        run: |
          python -m pip install --upgrade pip
          pip install -r agent-service/requirements.txt

      # ── 4b. Run local Python reviewer ────────────────────────────────────
      #
      # review_pr.py:
      #   1. Reads $GITHUB_EVENT_PATH to get PR metadata.
      #   2. Fetches the PR diff via PyGitHub (uses GH_TOKEN / GITHUB_TOKEN).
      #   3. Runs ReviewSupervisor (Security + Style + Logic agents concurrently).
      #   4. Writes review-result.json with findings, verdict, summary.
      #   5. Posts a PR summary comment via gh CLI.
      #   6. Creates a GitHub Check Run with annotations via PyGitHub.
      - name: Run local AI reviewer (Option B — local reviewer)
        if: vars.REVIEW_MODE == 'local'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::GEMINI_API_KEY secret is required for local review mode."
            exit 1
          fi

          echo "Running AI Code Reviewer in local mode..."
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "PR: #${PR_NUMBER}"
          echo "Head SHA: ${PR_HEAD_SHA:0:7}"

          python agent-service/scripts/review_pr.py
